const V={"الفاتحة":7,"البقرة":286,"آل عمران":200,"النساء":176,"المائدة":120,"الأنعام":165,"الأعراف":206,"الأنفال":75,"التوبة":129,"يونس":109,"هود":123,"يوسف":111,"الرعد":43,"إبراهيم":52,"الحجر":99,"النحل":128,"الإسراء":111,"الكهف":110,"مريم":98,"طه":135,"الأنبياء":112,"الحج":78,"المؤمنون":118,"النور":64,"الفرقان":77,"الشعراء":227,"النمل":93,"القصص":88,"العنكبوت":69,"الروم":60,"لقمان":34,"السجدة":30,"الأحزاب":73,"سبأ":54,"فاطر":45,"يس":83,"الصافات":182,"ص":88,"الزمر":75,"غافر":85,"فصلت":54,"الشورى":53,"الزخرف":89,"الدخان":59,"الجاثية":37,"الأحقاف":35,"محمد":38,"الفتح":29,"الحجرات":18,"ق":45,"الذاريات":60,"الطور":49,"النجم":62,"القمر":55,"الرحمن":78,"الواقعة":96,"الحديد":29,"المجادلة":22,"الحشر":24,"الممتحنة":13,"الصف":14,"الجمعة":11,"المنافقون":11,"التغابن":18,"الطلاق":12,"التحريم":12,"الملك":30,"القلم":52,"الحاقة":52,"المعارج":44,"نوح":28,"الجن":28,"المزمل":20,"المدثر":56,"القيامة":40,"الإنسان":31,"المرسلات":50,"النبأ":40,"النازعات":46,"عبس":42,"التكوير":29,"الانفطار":19,"المطففين":36,"الانشقاق":25,"البروج":22,"الطارق":17,"الأعلى":19,"الغاشية":26,"الفجر":30,"البلد":20,"الشمس":15,"الليل":21,"الضحى":11,"الشرح":8,"التين":8,"العلق":19,"القدر":5,"البينة":8,"الزلزلة":8,"العاديات":11,"القارعة":11,"التكاثر":8,"العصر":3,"الهمزة":9,"الفيل":5,"قريش":4,"الماعون":7,"الكوثر":3,"الكافرون":6,"النصر":3,"المسد":5,"الإخلاص":4,"الفلق":5,"الناس":6};
let students=JSON.parse(localStorage.students||"[]"), recs=JSON.parse(localStorage.recs||"[]");
recs=recs.map(r=>{if(r.selectionType)return r; if(r.range==="السورة كاملة")return {...r,selectionType:"single",surahs:[r.surah]}; let m=(r.range||"").match(/من الآية (\d+) إلى الآية (\d+)/); return {...r,selectionType:"amount",surahs:[r.surah],from:r.from||m?.[1]||"",to:r.to||m?.[2]||""};});

function home(){let speakingStudents=new Set(recs.map(r=>r.student)).size;let repeatStudents=new Set(recs.filter(r=>r.type==="إعادة"||r.grade==="يحتاج إلى إعادة").map(r=>r.student)).size;let completedStudents=new Set(students.filter(s=>countCompletedSurahsForStudent(s)===114)).size;

let arr=students.map((s,i)=>[s,i]).filter(x=>x[0].toLowerCase().includes(q));el.innerHTML=arr.length?arr.map(x=>`<div class=item><button onclick="studentPage(${x[1]})">${x[0]}</button><button class=secondary onclick="renameStudent(${x[1]})">تعديل</button><button class=danger onclick="delStudent(${x[1]})">حذف</button></div>`).join(""):"لا توجد نتائج."}

 setTimeout(()=>{const input=document.getElementById("studentNameEdit");if(input){input.focus();input.select();input.onkeydown=e=>{if(e.key==="Enter")saveStudentName(i);if(e.key==="Escape")closeAppModal()}}},0);

function saveStudentName(i){
 const input=document.getElementById("studentNameEdit"), n=(input?.value||"").trim();
 if(!n){showToast("يرجى إدخال اسم الطالب.");input?.focus();return}
 const old=students[i];students[i]=n;recs.forEach(r=>{if(r.student===old)r.student=n});save();closeAppModal();studentsPage();showToast("تم تعديل اسم الطالب بنجاح ✅");
}

 const name=students[i];
 openAppModal("تأكيد حذف الطالب",'<p>هل تريد حذف الطالب <b>'+escapeHtml(name)+'</b> وجميع تسميعاته؟</p>','<button class="secondary" onclick="closeAppModal()">إلغاء</button><button class="danger" onclick="confirmDeleteStudent('+i+')">حذف الطالب</button>');
}
function confirmDeleteStudent(i){if(!students[i]){closeAppModal();return}const name=students[i];recs=recs.filter(r=>r.student!==name);students.splice(i,1);save();closeAppModal();studentsPage();showToast("تم حذف الطالب وتسميعاته.") }
// حدود أرباع الحزب الفعلية في مصحف المدينة (رواية حفص): كل رقم هو رقم الآية العالمي لأول آية في الربع.
// المصدر: بيانات Quran Meta / HafsLists؛ 240 ربعًا تغطي 6236 آية.
const RUB_BOUNDARIES=[
0,1,33,51,67,82,99,113,131,149,165,184,196,210,226,240,250,260,270,279,290,308,326,345,368,
386,406,426,446,464,479,494,505,517,529,551,567,581,593,607,628,641,656,670,681,696,710,720,
736,751,766,778,802,825,848,863,884,900,916,930,940,955,985,1001,1019,1042,1071,1096,1110,1125,
1143,1161,1182,1201,1221,1236,1254,1269,1281,1295,1310,1328,1346,1357,1375,1390,1417,1435,1454,
1479,1497,1514,1534,1557,1581,1603,1626,1649,1673,1697,1712,1726,1742,1760,1778,1803,1852,1902,
1931,1952,1976,1991,2012,2030,2052,2079,2099,2128,2157,2172,2191,2215,2239,2272,2309,2349,2403,
2431,2459,2484,2512,2534,2566,2596,2614,2633,2655,2674,2709,2748,2792,2812,2826,2844,2856,2876,
2908,2933,2984,3043,3113,3160,3186,3215,3241,3264,3281,3303,3328,3341,3366,3386,3410,3440,3463,
3491,3514,3534,3551,3564,3584,3593,3616,3630,3652,3675,3701,3733,3765,3810,3871,3933,3991,4022,
4066,4090,4111,4134,4154,4174,4199,4227,4243,4265,4285,4299,4323,4349,4382,4431,4485,4511,4531,
4555,4578,4601,4613,4626,4657,4706,4759,4810,4855,4902,4980,5054,5091,5105,5118,5137,5157,5178,
5192,5218,5230,5242,5272,5324,5394,5448,5495,5552,5610,5673,5759,5830,5885,5949,6024,6091,6155,6237
];
// رقم البداية العالمي لكل سورة (ترقيم حفص: 1..6236).
const SURAH_GLOBAL_START=[];{let n=1;for(const name of S){SURAH_GLOBAL_START.push(n);n+=V[name]||0;}}
function addCoverageFromRec(map,r){
  const add=(surah,a,b)=>{if(!surah)return;let max=V[surah]||0;a=Math.max(1,Number(a)||1);b=Math.min(max,Number(b)||max);if(b<a)return;(map[surah]??=[]).push([a,b]);};
  if(r.selectionType==="multi"){(r.surahs||[]).forEach(s=>add(s,1,V[s]));return;}
  if(r.selectionType==="single") add(r.surah,1,V[r.surah]);
  else if(r.selectionType==="amount") add(r.surah,r.from||1,r.to||r.from||1);
  else if(r.surah) add(r.surah,r.range==="السورة كاملة"?1:r.from||1,r.range==="السورة كاملة"?V[r.surah]:r.to||r.from||1);
}
function buildCoverage(list){let map={};list.forEach(r=>addCoverageFromRec(map,r));Object.keys(map).forEach(s=>{map[s].sort((a,b)=>a[0]-b[0]);let out=[];for(const x of map[s]){let last=out[out.length-1];if(last&&x[0]<=last[1]+1)last[1]=Math.max(last[1],x[1]);else out.push([...x]);}map[s]=out;});return map;}
function rangeCovered(map,s,a,b){let seg=map[s]||[],pos=a;for(const [x,y] of seg){if(y<pos)continue;if(x>pos)return false;pos=y+1;if(pos>b)return true;}return pos>b;}
function countHizbForStudent(list){
 // كل ربع له حدود آيات فعلية من مصحف المدينة. الآيات المتكررة لا تُحسب مرتين.
 // داخل الربع غير المكتمل، التقدير يكون بنسبة الآيات المغطاة من آيات ذلك الربع.
 const map=buildCoverage(list);let total=0;
 for(let i=1;i<RUB_BOUNDARIES.length-1;i++){
  const first=RUB_BOUNDARIES[i],last=RUB_BOUNDARIES[i+1]-1;
  if(first<1||last<first)continue;
  let covered=0;
  for(let id=first;id<=last;id++){
   let lo=0,hi=SURAH_GLOBAL_START.length-1;
   while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(SURAH_GLOBAL_START[mid]<=id)lo=mid;else hi=mid-1;}
   const surah=S[lo],ayah=id-SURAH_GLOBAL_START[lo]+1;
   if((map[surah]||[]).some(([a,b])=>ayah>=a&&ayah<=b))covered++;
  }
  total+=covered/(last-first+1)/4;
 }
 return Math.min(60,total);
}
function formatHizbAmount(value){
 if(!value||value<=0)return '0 حزب';
 if(value>=59.999)return '60 حزبًا (القرآن كاملًا)';
 let full=Math.floor(value+1e-9),frac=value-full;
 let eighths=Math.round(frac*8),remainder=frac-eighths/8;
 if(eighths===8){full++;eighths=0;remainder=0;}
 const parts=[];
 if(full)parts.push(full===1?'حزب':`${full} أحزاب`);
 const fracNames={1:'ثمن',2:'ربع',3:'ربع وثمن',4:'نصف',5:'نصف وثمن',6:'ثلاثة أرباع',7:'ثلاثة أرباع وثمن'};
 if(eighths)parts.push(fracNames[eighths]);
 if(remainder>0.03)parts.push('وزيادة');
 else if(remainder< -0.03)parts.push('تقريبًا');
 return parts.join(' و ') || 'أقل من ثمن حزب';
}
function countCompletedSurahsForStudent(student){let list=recs.filter(r=>r.student===student),map=buildCoverage(list);return S.reduce((n,s)=>n+(rangeCovered(map,s,1,V[s])?1:0),0);}
function studentPage(i){let s=students[i],list=recs.filter(r=>r.student===s),hizbCount=formatHizbAmount(countHizbForStudent(list)),completedSurahs=countCompletedSurahsForStudent(s),isKhatim=completedSurahs===114;app.innerHTML=`<button class="secondary" onclick="studentsPage()">⬅ الرجوع إلى الطلاب</button><div class=card><h2>👤 ${s}</h2>${isKhatim?`<div class="khatim"><div class="party">🎉🎊🏆</div><strong>ما شاء الله! الطالب خاتم للقرآن الكريم</strong><div>أتمّ حفظ السور الـ 114 كاملةً</div></div>`:""}<p>عدد التسميعات: <b>${list.length}</b></p><p>مقدار التسميع: <b>${hizbCount}</b> من 60 حزبًا</p><small class="muted">الحساب يعتمد على حدود أرباع الحزب الفعلية في مصحف المدينة، ويقدّر الجزء غير المكتمل بنسبة الآيات المغطاة داخل الربع.</small><p>عدد السور المكتملة: <b>${completedSurahs}</b> من 114</p>
<button onclick=formPage("${encodeURIComponent(s)}")>📝 تسجيل تسميع</button>

</div><button class=secondary onclick=studentsPage()>⬅ الرجوع إلى الطلاب</button>`}
function historySurahLabel(r){return r.selectionType==="multi"?(r.surahs||[]).join("، "):(r.surah||((r.surahs||[]).join("، ")))}
function recItem(r){return `<div class=item><b>${r.student}</b><br><span class=badge>${r.date}</span><span class=badge>${historySurahLabel(r)}</span>${r.range?`<span class=badge>${r.range}</span>`:""}<br><span class=badge>${r.type||"—"}</span><span class=badge>${r.grade||"—"}</span><p>${r.note||"لا توجد ملاحظة"}</p><button class=secondary onclick="editRec('${r.id}')">تعديل</button><button class=danger onclick="deleteRec('${r.id}')">حذف</button></div>`}
function lastForStudent(name){
 let a=recs.filter(r=>r.student===name).sort((x,y)=>(y.date||'').localeCompare(x.date||'') || (Number(y.id)||0)-(Number(x.id)||0));
 return a[0]||null;
}
function currentSelectionKey(){
 let m=document.getElementById("mode")?.value;
 if(m==="multi"){
  let vals=[...document.querySelectorAll("#multiSurahs option:checked")].map(o=>o.value).sort();
  return "multi|"+vals.join("،");
 }
 if(m==="single") return "single|"+document.getElementById("surah").value;
 return "amount|"+document.getElementById("surah").value+"|"+document.getElementById("from").value+"|"+document.getElementById("to").value;
}
function selectionLabel(r){
 if(r.selectionType==="multi") { let a=(r.surahs||[]).slice().sort((a,b)=>S.indexOf(a)-S.indexOf(b)); return "آخر سورة: "+(a[a.length-1]||""); }
 if(r.selectionType==="single") return "السورة: "+r.surah;
 return r.surah+" — "+r.range;
}
function formPage(pref="",editId=""){
 let editing=editId?recs.find(r=>r.id===editId):null, prefName=pref?decodeURIComponent(pref):(editing?.student||"");
 if(!students.length){alert("أضف طالبًا أولًا.");return studentsPage()}
 let last=lastForStudent(prefName||students[0]);
 let oldType=editing?.selectionType || (editing?.surahs?.length>1?"multi":(editing?.range&&editing.range!=="السورة كاملة"?"amount":"single"));
 const previousButtons=(editing&&historyReturnState)?'<button class="secondary" onclick="returnToHistory()">⬅ السابق</button>':"";
 app.innerHTML=`${previousButtons}<div class=card><h2>${editing?"✏️ تعديل التسميع":"📝 تسجيل تسميع"}</h2>
 <label>الطالب</label><select id=student onchange=showLast() onchange2=x>${students.map(s=>`<option ${s===prefName?"selected":""}>${s}</option>`).join("")}</select>
 <div id=lastInfo class="lastinfo">${last?`📌 <b>آخر تسميع للطالب:</b> ${selectionLabel(last)} — ${last.date}`:"📌 لا يوجد تسميع سابق لهذا الطالب."}</div>
 <label>التاريخ</label><input id=date type=date value="${editing?.date||today()}">
 <label>نوع المقدار</label>
 <div class="choiceRow">
  <button type="button" id="btnMulti" class="choice ${oldType==="multi"?"active":""}" onclick="setMode('multi')">① أكثر من سورة</button>
  <button type="button" id="btnSingle" class="choice ${oldType==="single"?"active":""}" onclick="setMode('single')">② سورة واحدة</button>
  <button type="button" id="btnAmount" class="choice ${oldType==="amount"?"active":""}" onclick="setMode('amount')">③ مقدار من السورة</button>
 </div>
 <div id=multiBox class="${oldType==="multi"?"":"hidden"}"><label>اختر السور (يمكن اختيار أكثر من سورة)</label><select id=multiSurahs multiple size=8>${S.map(x=>`<option value="${x}" ${(editing?.surahs||[]).includes(x)?"selected":""}>${x}</option>`).join("")}</select><div class=muted>اضغط على أكثر من سورة لاختيارها.</div></div>
 <div id=singleBox class="${oldType==="single"?"":"hidden"}"><label>البحث عن السورة</label><input class=surahSearch id=singleSearch placeholder="🔎 اكتب اسم السورة للبحث" oninput="filterSurahs('single')"><label>اختر السورة</label><select id=surah>${S.map(x=>`<option ${x===(editing?.surah||"")?"selected":""}>${x}</option>`).join("")}</select></div>
 <div id=amountBox class="${oldType==="amount"?"":"hidden"}"><label>البحث عن السورة</label><input class=surahSearch id=amountSearch placeholder="🔎 اكتب اسم السورة للبحث" oninput="filterSurahs('amount')"><label>اختر السورة</label><select id=surahAmount onchange="updateVerseLimits()">${S.map(x=>`<option ${x===(editing?.surah||"")?"selected":""}>${x}</option>`).join("")}</select><div id=verseLimit class="muted"></div><div class=spinRow><div><label for=verseFrom>بداية الآية</label><div class=spinBox><button type="button" class=spinBtn onclick="changeVerseFrom(1)" aria-label="زيادة بداية الآية">▲</button><input id=verseFrom type="number" inputmode="numeric" min="1" max="${V[editing?.surah||S[0]]||1}" value="${editing?.from||1}" oninput="updateFromVerse()"><button type="button" class=spinBtn onclick="changeVerseFrom(-1)" aria-label="إنقاص بداية الآية">▼</button></div></div><div><label for=verseTo>نهاية الآية</label><div class=spinBox><button type="button" class=spinBtn onclick="changeVerseTo(1)" aria-label="زيادة نهاية الآية">▲</button><input id=verseTo type="number" inputmode="numeric" min="${editing?.from||1}" max="${V[editing?.surah||S[0]]||1}" value="${editing?.to||editing?.from||1}" oninput="updateVerseTo()"><button type="button" class=spinBtn onclick="changeVerseTo(-1)" aria-label="إنقاص نهاية الآية">▼</button></div></div></div><div id=rangePreview class="rangePreview"></div></div>
 <label>نوع التسميع</label><select id=type>${["حفظ جديد","مراجعة","إعادة"].map(x=>`<option ${x===editing?.type?"selected":""}>${x}</option>`).join("")}</select>
 <label>التقييم</label><select id=grade>${["ممتاز","جيد جدًا","جيد","يحتاج إلى إعادة"].map(x=>`<option ${x===editing?.grade?"selected":""}>${x}</option>`).join("")}</select>
 <label>الملاحظة</label><textarea id=note rows=4 placeholder="مثال: إعادة التسميع بسبب كثرة الأخطاء">${editing?.note||""}</textarea>
 <button onclick="saveRec('${editId}')">💾 ${editing?"حفظ التعديل":"حفظ التسميع"}</button></div>${previousButtons}<button class=secondary onclick=home()>⬅ الرئيسية</button>`
 updateVerseLimits();
}
function showLast(){let x=lastForStudent(document.getElementById("student").value);document.getElementById("lastInfo").innerHTML=x?`📌 <b>آخر تسميع للطالب:</b> ${selectionLabel(x)} — ${x.date}`:`📌 لا يوجد تسميع سابق لهذا الطالب.`}
function filterSurahs(kind){
 let input=document.getElementById(kind==='single'?'singleSearch':'amountSearch');
 let sel=document.getElementById(kind==='single'?'surah':'surahAmount');
 if(!input||!sel)return;
 let q=(input.value||'').trim().toLowerCase();
 let current=sel.value;
 let matches=S.filter(x=>x.toLowerCase().includes(q));
 sel.innerHTML=matches.map(x=>`<option>${x}</option>`).join('');
 if(matches.includes(current)) sel.value=current;
 else if(matches.length) sel.value=matches[0];
 if(kind==='amount') updateVerseLimits();
}
function updateVerseLimits(){
 let sel=document.getElementById("surahAmount"), box=document.getElementById("verseLimit"), from=document.getElementById("verseFrom"), to=document.getElementById("verseTo"); if(!sel||!box||!from||!to)return;
 let n=V[sel.value]||1; box.textContent=n?`عدد آيات سورة ${sel.value}: ${n}`:"";
 let start=Math.min(Math.max(parseInt(from.value,10)||1,1),n);
 let end=Math.min(Math.max(parseInt(to.value,10)||start,start),n);
 from.min=1; from.max=n; from.value=start;
 to.min=start; to.max=n;
 // لا نجعل النهاية تساوي آخر آية تلقائيا؛ نحافظ على القيمة الحالية ما دامت صالحة.
 if(end<start) end=start;
 to.value=end;
 updateVerseTo();
}
function updateFromVerse(){
 let from=document.getElementById("verseFrom"), to=document.getElementById("verseTo"), sel=document.getElementById("surahAmount"), preview=document.getElementById("rangePreview"); if(!from||!to||!sel)return;
 let max=V[sel.value]||1;
 from.max=max; to.max=max;
 // نسمح بترك الخانة فارغة أثناء الكتابة اليدوية حتى يمكن إدخال أرقام من خانتين أو أكثر.
 let raw=(from.value||"").trim();
 if(raw===""){
   to.min=1;
   if(preview)preview.textContent=`أدخل رقم بداية الآية (من 1 إلى ${max})`;
   return;
 }
 let parsed=parseInt(raw,10);
 if(!Number.isFinite(parsed)){
   if(preview)preview.textContent=`أدخل رقم بداية الآية (من 1 إلى ${max})`;
   return;
 }
 let start=Math.min(Math.max(parsed,1),max);
 if(String(start)!==raw) from.value=start;
 to.min=start;
 let endRaw=(to.value||"").trim();
 if(endRaw!==""){
   let end=parseInt(endRaw,10);
   if(Number.isFinite(end)) to.value=Math.min(max,Math.max(start,end));
 }
 updateVerseTo();
}
function updateVerseTo(){
 let from=document.getElementById("verseFrom"), to=document.getElementById("verseTo"), preview=document.getElementById("rangePreview"), sel=document.getElementById("surahAmount");
 if(!from||!to)return;
 let max=Number(to.max)||V[sel?.value]||1;
 let startRaw=(from.value||"").trim();
 let start=Math.min(Math.max(parseInt(startRaw,10)||1,1),max);
 to.min=start; to.max=max;
 // Keep the end field editable: do not replace an empty/partially typed value,
 // and never jump automatically to the last ayah of the surah.
 let endRaw=(to.value||"").trim();
 if(endRaw===""){
   if(preview)preview.textContent=`أدخل رقم نهاية الآية (من ${start} إلى ${max})`;
   return;
 }
 let parsed=parseInt(endRaw,10);
 if(!Number.isFinite(parsed)){
   if(preview)preview.textContent=`أدخل رقم نهاية الآية (من ${start} إلى ${max})`;
   return;
 }
 let end=Math.min(Math.max(parsed,start),max);
 if(String(end)!==endRaw) to.value=end;
 if(preview)preview.textContent=`المقدار: من الآية ${start} إلى الآية ${end} (عدد الآيات: ${end-start+1})`;
}
function changeVerseFrom(delta){
 let from=document.getElementById("verseFrom"), to=document.getElementById("verseTo"), sel=document.getElementById("surahAmount"); if(!from||!to||!sel)return;
 let max=V[sel.value]||1, cur=parseInt(from.value,10)||1, next=Math.min(max,Math.max(1,cur+delta));
 from.value=next;
 from.max=max;
 to.min=next;
 to.max=max;
 let end=parseInt(to.value,10)||next;
 if(end<next) end=next;
 to.value=Math.min(max,end);
 updateVerseTo();
}
function changeVerseTo(delta){
 let from=document.getElementById("verseFrom"), to=document.getElementById("verseTo"); if(!from||!to)return;
 let min=parseInt(to.min,10)||parseInt(from.value,10)||1, max=parseInt(to.max,10)||1, cur=parseInt(to.value,10)||min;
 to.value=Math.min(max,Math.max(min,cur+delta)); updateVerseTo();
}
function setMode(m){
 document.getElementById("multiBox").classList.toggle("hidden",m!=="multi");document.getElementById("singleBox").classList.toggle("hidden",m!=="single");document.getElementById("amountBox").classList.toggle("hidden",m!=="amount");
 ["btnMulti","btnSingle","btnAmount"].forEach(id=>document.getElementById(id).classList.remove("active"));document.getElementById(m==="multi"?"btnMulti":m==="single"?"btnSingle":"btnAmount").classList.add("active");
}
function getFormData(id=""){
 let m=document.querySelector(".choice.active")?.id==="btnMulti"?"multi":document.querySelector(".choice.active")?.id==="btnSingle"?"single":"amount";
 let obj={id:id||Date.now().toString(),student:student.value,date:date.value,selectionType:m,type:type.value,grade:grade.value,note:note.value};
 if(m==="multi"){obj.surahs=[...multiSurahs.selectedOptions].map(o=>o.value);if(!obj.surahs.length)throw "اختر سورتين أو أكثر.";obj.surahs.sort();obj.surah="";obj.range=""}
 else if(m==="single"){obj.surah=surah.value;obj.surahs=[obj.surah];obj.range="السورة كاملة"}
 else {let max=V[surahAmount.value]||0,startRaw=(verseFrom?.value||"").trim(),endRaw=(verseTo?.value||"").trim();if(startRaw===""||!Number.isInteger(Number(startRaw)))throw "أدخل رقم بداية الآية يدويًا.";if(endRaw===""||!Number.isInteger(Number(endRaw)))throw "أدخل رقم نهاية الآية يدويًا.";let start=Number(startRaw),end=Number(endRaw);if(!max||start<1||start>max||end<1||end>max)throw `عدد آيات سورة ${surahAmount.value} هو ${max}.`;if(end<start)throw "نهاية الآية يجب أن تكون مساوية أو أكبر من البداية.";obj.surah=surahAmount.value;obj.surahs=[obj.surah];obj.from=start;obj.to=end;obj.range=`من الآية ${start} إلى الآية ${end}`}
 return obj;
}
function duplicateSameDay(obj,id=""){
 let surahs=r=>r.selectionType==="multi"?(r.surahs||[]):(r.surah?[r.surah]:[]);
 return recs.find(r=>{
  if(r.id===id||r.student!==obj.student||r.date!==obj.date)return false;
  let a=surahs(obj), b=surahs(r), overlap=a.some(x=>b.includes(x));
  if(!overlap)return false;
  // أكثر من سورة: يبقى المنع كما هو لأي سورة مشتركة في نفس الحلقة.
  if(obj.selectionType==="multi" || r.selectionType==="multi") return true;
  // السورة كاملة تمنع أي تسجيل آخر للسورة في نفس الحلقة.
  if(obj.selectionType==="single" || r.selectionType==="single") return true;
  // في "مقدار من السورة": إذا كان أحد المقادير السابقة قد وصل إلى آخر آية،
  // فقد اكتملت السورة، وبالتالي لا يسمح بأي مقدار جديد منها في نفس اليوم.
  if(obj.selectionType==="amount" && r.selectionType==="amount" && obj.surah===r.surah){
   let max=V[obj.surah]||0;
   if(Number(r.to)===max || Number(obj.to)===max) return true;
   // قبل اكتمال السورة، يسمح بالمقدار الجديد حتى لو كان متداخلاً.
   return false;
  }
  return false;
 });
}
function saveRec(id=""){
 try{let obj=getFormData(id),dup=duplicateSameDay(obj,id);if(dup){alert("⚠️ لا يمكن تسجيل نفس السورة أو نفس مجموعة السور أو نفس المقدار للطالب في نفس يوم الحلقة.\n\nإذا كان المقصود إعادة التسميع في حلقة أخرى، سجّله في يوم/حلقة أخرى واكتب في الملاحظة: إعادة التسميع.");return}if(id){let k=recs.findIndex(r=>r.id===id);recs[k]=obj}else recs.push(obj);save();showToast("تم الحفظ في أرتل ✅");if(id&&historyReturnState){const st={...historyReturnState};historyReturnState=null;historyPage(st.q,st.f)}else historyPage()}catch(e){alert("⚠️ "+e)}
}
function editRec(id){const q=document.getElementById("hq"),f=document.getElementById("filter");historyReturnState=q?{q:q.value||"",f:f?.value||""}:null;formPage("",id)}
function returnToHistory(){const st=historyReturnState;historyReturnState=null;if(st)historyPage(st.q,st.f);else historyPage()}
function deleteRec(id){
 const rec=recs.find(r=>r.id===id);if(!rec)return;
 openAppModal("تأكيد حذف التسميع",'<p>هل تريد حذف تسميع <b>'+escapeHtml(rec.student||"")+'</b> بتاريخ '+escapeHtml(rec.date||"")+'؟</p>','<button class="secondary" onclick="closeAppModal()">إلغاء</button><button class="danger" onclick="confirmDeleteRec(\''+String(id)+'\')">حذف</button>');
}
function confirmDeleteRec(id){recs=recs.filter(r=>r.id!==id);save();closeAppModal();historyPage();showToast("تم حذف التسميع.")}
function historyPage(qValue="",fValue=""){app.innerHTML=`<div class=card><h2>📚 سجل التسميع</h2><input id=hq placeholder="🔎 ابحث باسم الطالب أو السورة" oninput=renderHistory()><select id=filter onchange=renderHistory()><option value="">كل الحالات</option><option>إعادة</option><option>يحتاج إلى إعادة</option><option>مراجعة</option><option>حفظ جديد</option></select></div><div class=card id=historyList></div><button class=secondary onclick=home()>⬅ الرئيسية</button>`;document.getElementById("hq").value=qValue;document.getElementById("filter").value=fValue;renderHistory()}
function renderHistory(){let q=(document.getElementById("hq")?.value||"").toLowerCase(),f=document.getElementById("filter")?.value||"",el=document.getElementById("historyList");if(!el)return;
let a=[...recs].reverse().filter(r=>((r.student||"")+" "+(r.surah||"")+" "+(r.surahs||[]).join(" ")).toLowerCase().includes(q)&&(!f||r.type===f||r.grade===f));el.innerHTML=a.length?a.map(recItem).join(""):"لا توجد نتائج."}
function repeatsPage(){let a=[...recs].reverse().filter(r=>r.type==="إعادة"||r.grade==="يحتاج إلى إعادة");app.innerHTML=`<div class=card><h2>🔄 التسميعات التي تحتاج إعادة</h2>${a.length?a.map(recItem).join(""):"ممتاز! لا توجد تسميعات معلّمة للإعادة."}</div><button class=secondary onclick=home()>⬅ الرئيسية</button>`}
function backupPage(){app.innerHTML=`<div class=card><h2>💾 النسخ الاحتياطي</h2><p>احفظ نسخة من بيانات الطلاب والتسميعات على هاتفك، ويمكن استرجاعها لاحقًا.</p>
<button onclick=exportData()>⬇️ تصدير نسخة احتياطية</button><label>استرجاع نسخة</label><input type=file id=file accept=".json"><button onclick=importData()>⬆️ استرجاع</button></div><button class=secondary onclick=home()>⬅ الرئيسية</button>`}
function exportData(){let d={version:2,exportedAt:new Date().toISOString(),students,recs};let json=JSON.stringify(d,null,2);if(window.AndroidBackup&&typeof window.AndroidBackup.exportBackup==="function"){window.AndroidBackup.exportBackup(json);return}let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download="حلقة_القرآن_نسخة_احتياطية.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(){
 let f=document.getElementById("file").files[0];
 if(!f){openAppModal("استرجاع النسخة الاحتياطية","<p>يرجى اختيار ملف النسخة الاحتياطية أولًا.</p>",'<button onclick="closeAppModal()">حسنًا</button>');return}
 let rd=new FileReader();
 rd.onload=()=>{
  try{
   let d=JSON.parse(rd.result);
   if(!Array.isArray(d.students)||!Array.isArray(d.recs))throw new Error("invalid backup");
   students=d.students;recs=d.recs;save();home();
   openAppModal("تم الاسترجاع","<p>تم استرجاع نسخة البيانات الاحتياطية بنجاح ✅</p>",'<button onclick="closeAppModal()">حسنًا</button>');
  }catch(e){openAppModal("تعذّر الاسترجاع","<p>الملف غير صالح أو لا يحتوي على بيانات أرتل.</p>",'<button onclick="closeAppModal()">حسنًا</button>')}
 };
 rd.readAsText(f)
}
// زر العودة إلى الرئيسية أعلى كل صفحة ما عدا الصفحة الرئيسية، دون زر السابق
const navObserver=new MutationObserver(()=>{
 const root=document.getElementById("app");
 if(!root||!root.firstElementChild)return;
 const isHome=!!root.querySelector(".top") && (root.textContent||"").includes("مرحبًا بكم في حلقة عبد الله بن مسعود");
 if(!isHome&&!root.querySelector(".pageNav")){
  const nav=document.createElement("div");nav.className="pageNav";
  nav.innerHTML='<button onclick="home()">🏠 الرئيسية</button>';
  root.insertBefore(nav,root.firstChild);
 }
 const appFooter=document.getElementById("appFooter");
 if(!appFooter){
  const footer=document.createElement("footer");footer.id="appFooter";footer.className="appFooter";
  footer.textContent="صاحب فكرة التطبيق ومشرف على تطويره: علي مسعود دريس";
  const appRoot=document.getElementById("app");
  if(appRoot) appRoot.insertAdjacentElement("afterend",footer);
 }
});
navObserver.observe(document.getElementById("app"),{childList:true});

home();

// تفعيل وضع العمل بدون إنترنت
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js", {scope: "/"})
      .catch(err => console.error("تعذر تفعيل الوضع بدون إنترنت:", err));
  });
}
