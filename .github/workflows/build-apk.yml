name: Generation APK Automatique

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Recuperer le code
      uses: actions/checkout@v4

    - name: Configurer Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Forcer la compilation du projet Android
      run: |
        chmod +x gradlew || echo "Pas de gradlew à la racine"
        ./gradlew assembleDebug --stacktrace || gradle assembleDebug

    - name: Sauvegarder l'APK genere
      uses: actions/upload-artifact@v4
      with:
        name: MonApplication-APK
        path: "**/*.apk"
